name: Nexus Mind Vault — Production CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: 🛡️ Audit, Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: TypeScript Root Typecheck
        run: npx tsc --noEmit

      - name: TypeScript Functions Typecheck
        run: npx tsc -p functions/tsconfig.json

      - name: Production Bundle Verification
        run: npm run build
        env:
          NODE_ENV: production

  deploy:
    name: 🚀 Cloud Run & Firebase Deployment
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Firebase Hosting & Functions
        if: env.FIREBASE_TOKEN != ''
        run: npx firebase-tools deploy --only hosting,functions,firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
